[project]
name = "gamelib"
version = "0.1.0"
description = "Export a Playnite game library to DuckDB and generate an HTML insights dashboard"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=2.0.1",
    "pythonnet>=3.2.1",
]

[project.scripts]
gamelib-export = "playnite_to_duckdb:main"
gamelib-insights = "game_insights:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["playnite_to_duckdb.py", "game_insights.py", "templates"]

[tool.hatch.build.targets.sdist]
only-include = ["playnite_to_duckdb.py", "game_insights.py", "templates", "README.md", "pyproject.toml"]
